events {
    worker_connections 1024;
}

http {
    # ─── Upstream Services ─────────────────────────
    upstream user_service {
        server host.docker.internal:4001;
    }

    upstream document_service {
        server host.docker.internal:4002;
    }

    upstream collaboration_service {
        server host.docker.internal:4003;
    }

    upstream notification_service {
        server host.docker.internal:4004;
    }

    upstream search_service {
        server host.docker.internal:4005;
    }

    # ─── Rate Limiting ─────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ─── Main Server ──────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ─── Health Check ──────────────────────────
        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # ─── User Service ─────────────────────────
        location /api/auth/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://user_service/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://user_service/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Document Service ─────────────────────
        location /api/workspaces/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://document_service/api/workspaces/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/documents/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://document_service/api/documents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Collaboration Service (WebSocket) ────
        location /ws/ {
            proxy_pass http://collaboration_service/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /api/collaboration/ {
            proxy_pass http://collaboration_service/api/collaboration/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── Notification Service ─────────────────
        location /api/notifications/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://notification_service/api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── Search Service ───────────────────────
        location /api/search/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://search_service/api/search/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
